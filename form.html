<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form style="width: 500px;">
        <fieldset>
            <legend>Student Data</legend>

            <label for="name"> Company Name</label>
            <input type="text" id="name" placeholder="Google" readonly><br><br>

            <label for="uname">Name</label>
            <input type="text" id="uname"> <br><br>

            <label for="email">Email</label>
            <input type="Email" id="email" required> <br><br>

            <label for="">Password</label>
            <input type="password" name="" id=""> <br><br>

            <label for="">Contact</label>
            <input type="tel" minlength="10" maxlength="10"> <br><br>

            <label for="">DOB</label>
            <input type="date" min="2000-01-01" max="2005-01-01"> <br><br>

            <label for="">Age</label>
            <input type="number" min="18" max="25"><br><br>

            <label for="">Time</label>
            <input type="time"><br><br>

            <label for="">Gender</label>
            <input type="radio" name="gender" >Male
            <input type="radio" name="gender">Female
            <input type="radio" name="gender">Other <br><br>

            <label for="">YOP</label>
            <select name="" id="">
                <option value="" hidden> Select</option>
                <option value="">2026</option>
                <option value="">2025</option>
                <option value="">2024</option>
                <option value="">2023</option>

            </select><br><br>

            <label for="">Skills</label>
            <input type="checkbox">HTML
            <input type="checkbox">CSS
            <input type="checkbox">jS
            <br><br>
            
            <label for="">Skills you know percent</label>
            <input type="range"><br><br>

            <label for="">Select Color</label>
            <input type="color">
            <br><br>



            <label for="">Address</label>
            <textarea name="" id=""></textarea> <br><br>

            <button>Submit</button>

        </fieldset>
    </form>
</body>

</html>
